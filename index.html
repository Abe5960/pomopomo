<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<meta name="theme-color" content="#edf2f7">
<title>Pomodoro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --blue:#3b82f6; --yellow:#f59e0b; --bg:#edf2f7; --text:#1a2540; --muted:#a0bcd8; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

  body {
    height:100vh; overflow:hidden;
    background:var(--bg);
    font-family:'Inter',-apple-system,sans-serif;
    color:var(--text); user-select:none;
    display:flex; flex-direction:column;
  }

  /* install bar */
  #install-bar {
    display:none; flex-shrink:0;
    background:#eff6ff; border-bottom:1px solid rgba(59,130,246,.12);
    padding:9px 16px; align-items:center; justify-content:space-between; gap:8px;
  }
  #install-bar.show { display:flex; }
  #install-bar span { font-size:11px; color:var(--blue); font-weight:500; }
  #btn-install {
    border:none; cursor:pointer; background:var(--blue); color:#fff;
    font-size:11px; font-weight:700; padding:6px 14px; border-radius:8px; white-space:nowrap;
  }
  #btn-install-close {
    border:none; background:none; cursor:pointer;
    font-size:18px; color:var(--muted); line-height:1; padding:0 4px;
  }

  /* top bar */
  #top-bar {
    flex-shrink:0;
    display:flex; align-items:center; justify-content:flex-end;
    padding:12px 16px 6px;
  }
  #btn-settings {
    width:34px; height:34px; border-radius:9px; border:none;
    background:#e2e8f0; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  #btn-settings:active { background:#cbd5e1; }

  /* cards horizontal snap scroll */
  #cards-wrap {
    flex:1;
    display:flex; flex-direction:row;
    overflow-x:scroll; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #cards-wrap::-webkit-scrollbar { display:none; }

  /* each timer card fills the viewport */
  .card {
    flex:none;
    width:100vw; height:100%;
    scroll-snap-align:start;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:0; padding:12px 20px 16px;
  }

  /* ring */
  .ring-wrap {
    position:relative;
    width:min(220px, 56vmin);
    height:min(220px, 56vmin);
    margin-bottom:28px;
  }
  .ring-svg {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    transform:rotate(-90deg);
  }
  .ring-track { fill:none; stroke:#dde5ee; stroke-width:16; }
  .ring-arc   { fill:none; stroke-width:16; stroke-linecap:round;
                transition:stroke-dasharray .7s linear; }
  .ring-inner {
    position:absolute; inset:18%;
    border-radius:50%; background:var(--bg);
    transition:box-shadow .4s;
  }
  .ring-center {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .time-display {
    font-family:'Orbitron',monospace;
    font-size:clamp(34px, 11vmin, 50px);
    font-weight:900; letter-spacing:.02em;
    color:var(--text); line-height:1;
    transition:color .4s, font-size .3s;
  }

  /* controls */
  .controls { display:flex; gap:10px; align-items:center; }
  .pomo-btn {
    border:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:600;
    letter-spacing:.07em; border-radius:10px;
    padding:0 16px; font-size:11px; text-transform:uppercase;
    background:#dde5ee; color:#7090b0;
    height:40px; display:flex; align-items:center; justify-content:center;
    transition:background .15s, transform .1s;
  }
  .pomo-btn:active { transform:scale(.95); background:#cdd6e3; }
  .pomo-btn:disabled { opacity:.35; cursor:default; transform:none !important; }
  .btn-main {
    border-radius:12px; padding:0 38px;
    font-size:13px; font-weight:700; letter-spacing:.12em;
    color:#fff; height:46px;
    transition:background .3s, transform .1s;
  }
  .btn-main:active { transform:scale(.96); }

  .done-badge {
    display:none; margin-top:16px;
    padding:5px 18px; border-radius:20px;
    font-size:11px; font-weight:700; letter-spacing:.06em;
  }
  .done-badge.show { display:block; }

  /* page indicator dots */
  #page-dots {
    flex-shrink:0;
    display:flex; justify-content:center; align-items:center; gap:6px;
    padding:10px 0 14px;
  }
  .pdot {
    height:6px; border-radius:3px;
    background:#cbd5e1; transition:all .3s ease;
    width:6px;
  }
  .pdot.active { background:var(--blue); width:18px; }
  #pdot-1.active { background:var(--yellow); }

  /* settings modal */
  #settings-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(26,37,64,.38); z-index:200;
    align-items:flex-end; justify-content:center;
  }
  #settings-overlay.show { display:flex; }
  #settings-modal {
    background:#edf2f7; border-radius:22px 22px 0 0;
    width:100%; max-width:480px; padding:24px 24px 52px;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
  .s-header {
    font-family:'Orbitron',monospace;
    font-size:10px; font-weight:700; letter-spacing:.4em; text-transform:uppercase;
    color:var(--muted); margin-bottom:20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  #btn-s-close {
    border:none; background:none; cursor:pointer;
    font-size:22px; color:var(--muted); line-height:1; padding:0;
  }
  .s-section { margin-bottom:18px; }
  .s-label {
    font-size:10px; font-weight:600; color:var(--muted);
    letter-spacing:.18em; text-transform:uppercase; margin-bottom:8px;
  }
  .s-chips { display:flex; gap:8px; flex-wrap:wrap; }
  .s-chip {
    padding:7px 16px; border-radius:20px;
    border:1px solid #cdd6e3; background:#e2e8f0;
    font-size:12px; color:#7090b0; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:500; transition:all .12s;
  }
  .s-chip.sel-blue   { background:var(--blue);   color:#fff; border-color:var(--blue);   font-weight:700; }
  .s-chip.sel-yellow { background:var(--yellow); color:#fff; border-color:var(--yellow); font-weight:700; }
  .s-save {
    width:100%; height:44px; border-radius:12px; border:none;
    background:var(--blue); color:#fff;
    font-family:'Orbitron',monospace; font-size:10px; font-weight:700;
    letter-spacing:.35em; text-transform:uppercase; cursor:pointer; margin-top:4px;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
</style>
</head>
<body>

<div id="install-bar">
  <span>📲 ホーム画面に追加でオフライン使用可能</span>
  <button id="btn-install">追加</button>
  <button id="btn-install-close">×</button>
</div>

<div id="top-bar">
  <button id="btn-settings">⚙️</button>
</div>

<div id="cards-wrap">
  <!-- Work Timer -->
  <div class="card">
    <div class="ring-wrap">
      <div class="ring-inner" id="w-ring-inner"></div>
      <svg class="ring-svg" viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="92"/>
        <circle class="ring-arc"   cx="110" cy="110" r="92" id="w-arc"/>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="w-time">25:00</div>
      </div>
    </div>
    <div class="controls">
      <button class="pomo-btn" id="w-reset">Reset</button>
      <button class="pomo-btn btn-main" id="w-start" style="background:var(--blue)">Start</button>
      <button class="pomo-btn" id="w-stop" disabled>Stop</button>
    </div>
    <div class="done-badge" id="w-badge" style="background:#dbeafe;color:#1d4ed8">✅ 作業終了！</div>
  </div>

  <!-- Break Timer -->
  <div class="card">
    <div class="ring-wrap">
      <div class="ring-inner" id="b-ring-inner"></div>
      <svg class="ring-svg" viewBox="0 0 220 220">
        <circle class="ring-track" cx="110" cy="110" r="92"/>
        <circle class="ring-arc"   cx="110" cy="110" r="92" id="b-arc"/>
      </svg>
      <div class="ring-center">
        <div class="time-display" id="b-time">05:00</div>
      </div>
    </div>
    <div class="controls">
      <button class="pomo-btn" id="b-reset">Reset</button>
      <button class="pomo-btn btn-main" id="b-start" style="background:var(--yellow)">Start</button>
      <button class="pomo-btn" id="b-stop" disabled>Stop</button>
    </div>
    <div class="done-badge" id="b-badge" style="background:#fef3c7;color:#92400e">☕ 休憩終了！</div>
  </div>
</div>

<div id="page-dots">
  <div class="pdot active" id="pdot-0"></div>
  <div class="pdot" id="pdot-1"></div>
</div>

<!-- Settings Modal -->
<div id="settings-overlay" onclick="if(event.target===this)closeSettings()">
  <div id="settings-modal">
    <div class="s-header">
      <span>Settings</span>
      <button id="btn-s-close" onclick="closeSettings()">×</button>
    </div>
    <div class="s-section">
      <div class="s-label">通知</div>
      <div class="s-chips" id="notify-chips">
        <button class="s-chip" data-val="sound">🔔 音のみ</button>
        <button class="s-chip" data-val="vibrate">📳 バイブのみ</button>
        <button class="s-chip" data-val="both">🔔📳 音＋バイブ</button>
      </div>
    </div>
    <div class="s-section">
      <div class="s-label">作業時間</div>
      <div class="s-chips" id="work-chips">
        <button class="s-chip" data-val="15">15分</button>
        <button class="s-chip" data-val="25">25分</button>
        <button class="s-chip" data-val="45">45分</button>
      </div>
    </div>
    <div class="s-section">
      <div class="s-label">休憩時間</div>
      <div class="s-chips" id="break-chips">
        <button class="s-chip" data-val="3">3分</button>
        <button class="s-chip" data-val="5">5分</button>
        <button class="s-chip" data-val="15">15分</button>
      </div>
    </div>
    <button class="s-save" onclick="saveSettings()">Save</button>
  </div>
</div>

<script>
(function(){

  /* ── PWA ── */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
  var deferredPrompt=null;
  var installBar=document.getElementById('install-bar');
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault(); deferredPrompt=e; installBar.classList.add('show');
  });
  document.getElementById('btn-install').addEventListener('click',function(){
    if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}
    installBar.classList.remove('show');
  });
  document.getElementById('btn-install-close').addEventListener('click',function(){
    installBar.classList.remove('show');
  });

  /* ── page dots ── */
  var cardsWrap=document.getElementById('cards-wrap');
  var pdots=[document.getElementById('pdot-0'),document.getElementById('pdot-1')];
  cardsWrap.addEventListener('scroll',function(){
    var idx=Math.round(cardsWrap.scrollLeft/cardsWrap.clientWidth);
    pdots.forEach(function(d,i){ d.classList.toggle('active',i===idx); });
  },{passive:true});

  /* ── Settings ── */
  var SETTINGS_KEY='pomo_settings_v1';
  var settings={notify:'both',workMin:25,breakMin:5};
  try{var sv=JSON.parse(localStorage.getItem(SETTINGS_KEY));if(sv)settings=Object.assign(settings,sv);}catch(e){}
  function saveSettingsStorage(){
    try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch(e){}
  }

  /* ── Audio ── */
  var audioCtx=null;
  function getACtx(){
    if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    return audioCtx;
  }
  function unlockAudio(){var c=getACtx();if(c&&c.state==='suspended')c.resume();}
  function playBeep(){
    var c=getACtx();if(!c)return;
    if(c.state==='suspended')c.resume();
    [0,0.38,0.76].forEach(function(t){
      var o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='sine';o.frequency.value=880;
      var s=c.currentTime+t;
      g.gain.setValueAtTime(0,s);
      g.gain.linearRampToValueAtTime(0.5,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,s+0.3);
      o.start(s);o.stop(s+0.32);
    });
  }
  function doVibrate(){try{if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);}catch(e){}}
  function fireAlert(){
    if(settings.notify==='sound'||settings.notify==='both')playBeep();
    if(settings.notify==='vibrate'||settings.notify==='both')doVibrate();
  }

  /* ── Timer ── */
  var R=92,CIRC=2*Math.PI*R;
  function fmt(s){
    s=Math.max(0,Math.round(s));
    return('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);
  }

  function makeTimer(cfg){
    var arcEl   =document.getElementById(cfg.id+'-arc');
    var timeEl  =document.getElementById(cfg.id+'-time');
    var innerEl =document.getElementById(cfg.id+'-ring-inner');
    var badgeEl =document.getElementById(cfg.id+'-badge');
    var btnStart=document.getElementById(cfg.id+'-start');
    var btnStop =document.getElementById(cfg.id+'-stop');
    var btnReset=document.getElementById(cfg.id+'-reset');

    var color=cfg.color,glow=cfg.glow;
    var total=cfg.getTotal();
    var timeLeft=total,isRunning=false,isDone=false;
    var startedAt=null,baseLeft=total,tmr=null;

    arcEl.style.stroke=color;
    arcEl.style.strokeDasharray='0 '+(CIRC+1);
    arcEl.style.strokeDashoffset=CIRC;

    function render(){
      var p=total>0?timeLeft/total:0;
      arcEl.style.strokeDasharray=(CIRC*(1-p))+' '+(CIRC*p+1);
      arcEl.style.strokeDashoffset=CIRC;
      arcEl.style.filter='drop-shadow(0 0 4px '+color+')';
      innerEl.style.boxShadow=isRunning?'inset 0 0 28px '+glow:'none';
      if(isDone){
        timeEl.textContent='DONE';timeEl.style.fontSize='clamp(28px,9vmin,40px)';timeEl.style.color=color;
        badgeEl.classList.add('show');
        btnStart.disabled=true;btnStop.disabled=true;
        btnStart.style.opacity='.35';
      } else {
        timeEl.textContent=fmt(timeLeft);timeEl.style.fontSize='clamp(34px,11vmin,50px)';timeEl.style.color='#1a2540';
        badgeEl.classList.remove('show');
        btnStart.disabled=isRunning;btnStop.disabled=!isRunning;
        btnStart.style.opacity='1';
      }
    }

    function finish(){
      clearInterval(tmr);tmr=null;
      isRunning=false;isDone=true;timeLeft=0;
      render();fireAlert();
    }

    function startTick(){
      clearInterval(tmr);
      tmr=setInterval(function(){
        if(!startedAt)return;
        var tl=baseLeft-Math.floor((Date.now()-startedAt)/1000);
        if(tl<=0){finish();return;}
        timeLeft=tl;render();
      },500);
    }

    function reset(){
      clearInterval(tmr);tmr=null;
      isRunning=false;isDone=false;
      total=cfg.getTotal();timeLeft=total;baseLeft=total;startedAt=null;
      render();
    }

    btnStart.addEventListener('click',function(){
      if(isDone||isRunning)return;
      unlockAudio();
      isRunning=true;startedAt=Date.now();baseLeft=timeLeft;
      startTick();render();
    });
    btnStop.addEventListener('click',function(){
      if(!isRunning)return;
      clearInterval(tmr);tmr=null;
      timeLeft=Math.max(0,baseLeft-Math.floor((Date.now()-startedAt)/1000));
      isRunning=false;startedAt=null;render();
    });
    btnReset.addEventListener('click',function(){
      if(confirm('タイマーをリセットしますか？'))reset();
    });

    function recoverBg(){
      if(!isRunning||!startedAt)return;
      var tl=baseLeft-Math.floor((Date.now()-startedAt)/1000);
      if(tl<=0){finish();return;}
      timeLeft=tl;startTick();render();
    }
    document.addEventListener('visibilitychange',function(){if(!document.hidden)recoverBg();});
    window.addEventListener('focus',recoverBg);

    render();
    return {reset:reset,updateTotal:function(){total=cfg.getTotal();reset();}};
  }

  var workTimer=makeTimer({
    id:'w',color:'#3b82f6',glow:'rgba(59,130,246,.18)',
    getTotal:function(){return settings.workMin*60;}
  });
  var breakTimer=makeTimer({
    id:'b',color:'#f59e0b',glow:'rgba(245,158,11,.18)',
    getTotal:function(){return settings.breakMin*60;}
  });

  /* ── Settings UI ── */
  document.getElementById('btn-settings').addEventListener('click',function(){
    unlockAudio();openSettings();
  });

  function syncChips(gid,val,cls){
    document.getElementById(gid).querySelectorAll('.s-chip').forEach(function(c){
      c.classList.remove('sel-blue','sel-yellow');
      if(c.dataset.val===val)c.classList.add(cls);
    });
  }

  window.openSettings=function(){
    syncChips('notify-chips',settings.notify,'sel-blue');
    syncChips('work-chips',String(settings.workMin),'sel-blue');
    syncChips('break-chips',String(settings.breakMin),'sel-yellow');
    document.getElementById('settings-overlay').classList.add('show');
  };
  window.closeSettings=function(){
    document.getElementById('settings-overlay').classList.remove('show');
  };

  ['notify-chips','work-chips','break-chips'].forEach(function(gid){
    var cls=gid==='break-chips'?'sel-yellow':'sel-blue';
    document.getElementById(gid).querySelectorAll('.s-chip').forEach(function(chip){
      chip.addEventListener('click',function(){
        document.getElementById(gid).querySelectorAll('.s-chip').forEach(function(c){
          c.classList.remove('sel-blue','sel-yellow');
        });
        this.classList.add(cls);
      });
    });
  });

  window.saveSettings=function(){
    function getVal(gid){
      var s=document.querySelector('#'+gid+' .s-chip.sel-blue,#'+gid+' .s-chip.sel-yellow');
      return s?s.dataset.val:null;
    }
    var n=getVal('notify-chips'),w=getVal('work-chips'),b=getVal('break-chips');
    if(n)settings.notify=n;
    if(w)settings.workMin=parseInt(w);
    if(b)settings.breakMin=parseInt(b);
    saveSettingsStorage();closeSettings();
    workTimer.updateTotal();breakTimer.updateTotal();
  };

})();
</script>
</body>
</html>
